# Names of the same lab test in English, Italian and common abbreviations
# (Assistant::LabDictionary). A report that says any name of a group finds
# the profile's analyte named with any other name of it: "Emoglobina" is the
# "Hemoglobin" already saved. A brand-new analyte keeps the report's wording.
#
# One group per test; a name may appear in one group only (the loader
# checks). Leave out abbreviations that mean different tests in different
# panels. Matching ignores case, accents and punctuation.

# Blood count
- [Hemoglobin, Haemoglobin, Emoglobina, Hb, HGB]
- [Hematocrit, Haematocrit, Ematocrito, HCT, Ht]
- [Red blood cells, Erythrocytes, Globuli rossi, Eritrociti, RBC, GR]
- [White blood cells, Leukocytes, Leucocytes, Globuli bianchi, Leucociti, WBC, GB]
- [Platelets, Thrombocytes, Piastrine, Trombociti, PLT]
- [Mean corpuscular volume, Volume corpuscolare medio, MCV]
- [Mean corpuscular hemoglobin, Contenuto emoglobinico medio, Emoglobina corpuscolare media, MCH]
- [Mean corpuscular hemoglobin concentration, Concentrazione emoglobinica corpuscolare media, MCHC]
- [Red cell distribution width, RDW, RDW-CV]
- [Mean platelet volume, Volume piastrinico medio, MPV]
- [Neutrophils, Neutrofili]
- [Lymphocytes, Linfociti]
- [Monocytes, Monociti]
- [Eosinophils, Eosinofili]
- [Basophils, Basofili]
- [Reticulocytes, Reticolociti]
- [Erythrocyte sedimentation rate, Velocità di eritrosedimentazione, ESR, VES]

