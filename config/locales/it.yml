it:
  # Giorni senza zero: "4 ottobre 2026", mai "04 ottobre".
  # The names of months and days, the order of a date's parts, am and pm are
  # Rails' own words too ("Rails' own words" below), so they are kept here
  # rather than borrowed from another gem's locale file.
  date:
    formats:
      default: "%d/%m/%Y"
      long: "%-d %B %Y"
      short: "%-d %b"
      day: "%a %-d %b"
      day_long: "%A %-d %B"
      weekday: "%a"
      month: "%b"
    day_names:
      - domenica
      - lunedì
      - martedì
      - mercoledì
      - giovedì
      - venerdì
      - sabato
    abbr_day_names:
      - dom
      - lun
      - mar
      - mer
      - gio
      - ven
      - sab
    month_names:
      -
      - gennaio
      - febbraio
      - marzo
      - aprile
      - maggio
      - giugno
      - luglio
      - agosto
      - settembre
      - ottobre
      - novembre
      - dicembre
    abbr_month_names:
      -
      - gen
      - feb
      - mar
      - apr
      - mag
      - giu
      - lug
      - ago
      - set
      - ott
      - nov
      - dic
    order:
      - day
      - month
      - year
  time:
    ago: "%{time} fa"
    formats:
      default: "%a, %d %b %Y %H:%M:%S %z"
      hour_minute: "%H:%M"
      long: "%-d %B %Y, %H:%M"
      short: "%-d %b, %H:%M"
    am: "am"
    pm: "pm"

