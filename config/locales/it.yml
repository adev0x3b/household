  # Rails' own words, which English has from Rails itself and Italian from
  # here (test/i18n_test.rb checks none is missing): numbers and sizes, lists
  # ("a, b e c"), validation messages, how long ago, a form's defaults.
  number:
    format:
      separator: ","
      delimiter: "."
      precision: 2
      round_mode: "default"
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        format: "%n %u"
        negative_format: "-%n %u"
        unit: "€"
        separator: ","
        delimiter: "."
        precision: 2
        significant: false
        strip_insignificant_zeros: false
    percentage:
      format:
        format: "%n%"
        delimiter: ""
    precision:
      format:
        delimiter: ""
    human:
      format:
        delimiter: ""
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: "B"
            other: "B"
          kb: "KB"
          mb: "MB"
          gb: "GB"
          tb: "TB"
          pb: "PB"
          eb: "EB"
          zb: "ZB"
      decimal_units:
        format: "%n %u"
        units:
          unit: ""
          thousand: "mila"
          million: "milioni"
          billion: "miliardi"
          trillion: "bilioni"
          quadrillion: "biliardi"

