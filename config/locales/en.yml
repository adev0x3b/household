en:
  # Days unpadded: "October 4, 2026", never "October 04".
  date:
    formats:
      long: "%B %-d, %Y"
      short: "%b %-d"
      day: "%a %-d %b"
      day_long: "%A, %B %-d"
      weekday: "%a"
      month: "%b"
  time:
