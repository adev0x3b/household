# bin/kamal … -d dev: https://$DEV_HOST<mount path> (config/deploy.yml). A
# branch under test, previewed from the console (the deployment runbook, "A
# branch on dev"): its own database — the demo household, its accounts open
# as on the demo (OPEN_ACCOUNTS) so a reviewer taps in, and an admin,
# made again by a fresh preview (bin/preview-dev) — volumes and secrets,
# behind Cloudflare Access. It holds no deploy token: its console shows the
# canned pipeline (DEPLOY_GITHUB_CANNED, Delivery::Github::Canned), so the
# console itself can be tried here without touching GitHub.

# A preview's image is built by the pipeline's Deploy workflow, into the
# package named after the repository it runs in (image.yml): PREVIEW_PACKAGE,
# household where the pipeline and the code share one.
image: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>/<%= ENV["PREVIEW_PACKAGE"].presence || "household" %>

proxy:
  host: <%= ENV.fetch("DEV_HOST") %>

env:
  clear:
    FILES_QUOTA: <%= ENV["FILES_QUOTA"].presence || "512MB" %> # the volume is 1 GB
    APP_HOST: <%= ENV.fetch("DEV_HOST") %>
    DB_HOST: household-dev-db
    DEPLOY_GITHUB_CANNED: "1"
    OPEN_ACCOUNTS: "<%= ENV["OPEN_ACCOUNTS"].presence || "alex.demo,sam.demo,robin.demo" %>"

volumes:
  - household_dev_storage:/rails/storage
  - household_dev_secrets:/rails/secrets

# Capped unless its environment says otherwise, so a branch can't starve production on the same machine.
servers:
  web:
    options:
      memory: "<%= ENV["WEB_MEMORY"].presence || "1GB" %>"
  job:
    options:
      memory: "<%= ENV["JOB_MEMORY"].presence || "1GB" %>"

accessories:
  db:
    service: household-dev-db
    volumes:
      - household_dev_db:/var/lib/postgresql/data
