name: An idea
description: Something the app could do, or do better.
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: What you are trying to do in your household, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: How it could work
      description: Optional. If you would like to build it yourself, say so, and we can agree on its shape first.
